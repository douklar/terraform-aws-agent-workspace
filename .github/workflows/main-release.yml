name: Release main

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  release:
    name: Create semantic release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Not the merge ref: the merge commit this job tags must be reachable.
          ref: main
          fetch-depth: 0

      - name: Calculate next semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          pr_title="$(jq -r '.pull_request.title // ""' "${GITHUB_EVENT_PATH}")"
          pr_body="$(jq -r '.pull_request.body // ""' "${GITHUB_EVENT_PATH}")"
          base_sha="$(jq -r '.pull_request.base.sha // ""' "${GITHUB_EVENT_PATH}")"
          merge_sha="$(jq -r '.pull_request.merge_commit_sha // ""' "${GITHUB_EVENT_PATH}")"

          title_regex='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([A-Za-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "${pr_title}" =~ ${title_regex} ]]; then
            echo "PR title must follow Conventional Commits, for example: feat: add workspace module" >&2
            echo "Current title: ${pr_title}" >&2
            exit 1
          fi

          commit_messages=""
          if [[ -n "${base_sha}" && -n "${merge_sha}" ]]; then
            commit_messages="$(git log --format='%s%n%b' "${base_sha}..${merge_sha}" 2>/dev/null || true)"
          fi

          release_text="${pr_title}"$'\n'"${pr_body}"$'\n'"${commit_messages}"
          bump_type="patch"

          if grep -Eqi '^[A-Za-z0-9_-]+(\([^)]+\))?!:' <<< "${release_text}"; then
            bump_type="major"
          elif grep -Eq '^BREAKING CHANGE:' <<< "${release_text}"; then
            bump_type="major"
          elif grep -Eqi '^feat(\([^)]+\))?:' <<< "${release_text}"; then
            bump_type="minor"
          elif grep -Eqi '^(fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?:' <<< "${release_text}"; then
            bump_type="patch"
          else
            echo "Unable to determine release bump from PR title or commits." >&2
            exit 1
          fi

          # Stable tags only, so v3.0.0-alpha.7 still releases as v3.0.0.
          latest_tag="$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"

          if [[ -z "${latest_tag}" ]]; then
            next_tag="v1.0.0"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${version}"

            case "${bump_type}" in
              major) next_tag="v$((major + 1)).0.0" ;;
              minor) next_tag="v${major}.$((minor + 1)).0" ;;
              patch) next_tag="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi

          echo "tag_name=${next_tag}" >> "${GITHUB_OUTPUT}"
          echo "bump_type=${bump_type}" >> "${GITHUB_OUTPUT}"
          echo "merge_sha=${merge_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ steps.version.outputs.tag_name }}"
          # This PR's merge commit, not current main: a second merge landing
          # mid-run must not ship under this version.
          target_sha="${{ steps.version.outputs.merge_sha }}"

          if [[ -z "${target_sha}" ]]; then
            target_sha="${GITHUB_SHA}"
          fi

          if git rev-parse --verify --quiet "refs/tags/${tag_name}" >/dev/null; then
            echo "Tag already exists: ${tag_name}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${tag_name}" "${target_sha}"
          git push origin "${tag_name}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
